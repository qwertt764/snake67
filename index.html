<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Собери 5 звезд</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    height: 100vh; height: 100dvh;
    background-color: #f8fafc; /* Светлый фон страницы */
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none; /* Отключаем скролл на телефоне */
  }
  
  .game-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
  }

  canvas {
    display: block;
    width: min(90vw, 80vh, 500px);
    height: min(90vw, 80vh, 500px);
    background: #ffffff; /* Белое поле */
  }

  /* Экран поверх игры */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  
  h1 { margin: 0 0 10px; font-size: 24px; color: #0f172a; }
  p { margin: 0 0 20px; color: #475569; font-size: 16px; line-height: 1.5; }
  
  .btn {
    display: inline-block;
    padding: 12px 24px;
    font-size: 18px; font-weight: 600; text-decoration: none;
    border-radius: 8px; border: none; cursor: pointer;
    background: #0f172a; color: #ffffff;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  
  /* Ссылка на секретик */
  .secret-link {
    background: #fbbf24; color: #0f172a;
    box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
  }
  .secret-link:hover { background: #f59e0b; }
  
  .hint { font-size: 13px; color: #94a3b8; margin-top: 15px; }
</style>
</head>
<body>

<div class="game-container">
  <canvas id="game"></canvas>
  
  <div class="overlay" id="overlay">
    <h1 id="ov-title">Собери 5 звезд!</h1>
    <p id="ov-text">И получи секретик.<br><br>Управление: стрелки или WASD.<br>На телефоне -свайпы по экрану.<br>Пробел -пауза.</p>
    <button class="btn" id="btn-start" onclick="startGame()">Играть</button>
  </div>
</div>

<div class="hint">Собрано звезд: <span id="score">0</span> / 5</div>

<script>
(() => {
  'use strict';

  // Настройки игры
  const COLS = 20;
  const ROWS = 20;
  const CELL = 20; // 20 клеток * 20px = 400px
  const SIZE = COLS * CELL;
  const START_SPEED = 130; // Начальная скорость (мс на шаг)
  const MAX_STARS = 5;
  const SITE_URL = "https://qwertt764.github.io/sashkkk/"; // Ссылка на твой сайт

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const btnStart = document.getElementById('btn-start');
  const scoreEl = document.getElementById('score');

  let snake, dir, nextDir, star, score, phase, speed, lastMoveTime, animationId;
  let touchStartX = 0, touchStartY = 0;

  // Настройка Canvas для четкости (Retina)
  const dpr = window.devicePixelRatio || 1;
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  ctx.scale(dpr, dpr);

  // Рисование пятиконечной звезды
  function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fillStyle = '#fbbf24'; // Желтый цвет
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#f59e0b';
    ctx.stroke();
  }

  function resetGame() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = START_SPEED;
    phase = 'playing';
    scoreEl.textContent = score;
    placeStar();
    overlay.classList.add('hidden');
    lastMoveTime = performance.now();
    
    cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(gameLoop);
  }

  function placeStar() {
    while (true) {
      const newStar = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      // Проверяем, не попала ли звезда на змейку
      if (!snake.some(seg => seg.x === newStar.x && seg.y === newStar.y)) {
        star = newStar;
        break;
      }
    }
  }

  function showOverlay(title, text, btnText, isWin) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    btnStart.textContent = btnText;
    
    if (isWin) {
      btnStart.className = 'btn secret-link';
      btnStart.onclick = () => window.open(SITE_URL, '_blank');
    } else {
      btnStart.className = 'btn';
      btnStart.onclick = startGame;
    }
    overlay.classList.remove('hidden');
  }

  function startGame() {
    resetGame();
  }

  function gameOver() {
    phase = 'gameover';
    showOverlay('Игра окончена', `Ты собрал ${score} из 5 звезд.<br>Попробуй еще раз!`, 'Заново', false);
  }

  function winGame() {
    phase = 'win';
    showOverlay('Победа! 🎉', 'Ты собрал все 5 звезд!<br>Твой секретик ждет:', 'Забрать секретик', true);
  }

  function update() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // Проверка на стены (классика - умираем)
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }

    const willEat = head.x === star.x && head.y === star.y;
    const body = willEat ? snake : snake.slice(0, -1);

    // Проверка на столкновение с собой
    if (body.some(seg => seg.x === head.x && seg.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (willEat) {
      score++;
      scoreEl.textContent = score;
      
      if (score >= MAX_STARS) {
        return winGame();
      }
      
      speed = Math.max(70, speed - 10); // Ускоряемся
      placeStar();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Рисуем звезду
    if (star) {
      drawStar(star.x * CELL + CELL/2, star.y * CELL + CELL/2, 5, CELL/2.2, CELL/5);
    }

    // Рисуем змейку (черная)
    ctx.fillStyle = '#000000';
    for (let i = 0; i < snake.length; i++) {
      const seg = snake[i];
      ctx.beginPath();
      // Немного скругляем углы
      if (ctx.roundRect) {
        ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, i === 0 ? 6 : 3);
      } else {
        ctx.rect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
      }
      ctx.fill();
    }
  }

  function gameLoop(timestamp) {
    if (phase === 'playing') {
      if (timestamp - lastMoveTime >= speed) {
        update();
        lastMoveTime = timestamp;
      }
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  // --- Управление ---
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' && phase === 'playing') {
      phase = 'paused';
      showOverlay('Пауза', 'Нажми пробел чтобы продолжить', 'Продолжить', false);
      btnStart.onclick = () => { phase = 'playing'; overlay.classList.add('hidden'); lastMoveTime = performance.now(); animationId = requestAnimationFrame(gameLoop); };
      return;
    }

    let key = e.key.toLowerCase();
    if (['arrowup', 'w'].includes(key) && dir.y === 0) nextDir = {x: 0, y: -1};
    if (['arrowdown', 's'].includes(key) && dir.y === 0) nextDir = {x: 0, y: 1};
    if (['arrowleft', 'a'].includes(key) && dir.x === 0) nextDir = {x: -1, y: 0};
    if (['arrowright', 'd'].includes(key) && dir.x === 0) nextDir = {x: 1, y: 0};
  });

  // Свайпы для телефона
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
    e.preventDefault();
  }, { passive: false });

  function handleSwipe(startX, startY, endX, endY) {
    if (phase !== 'playing') return;
    const dx = endX - startX;
    const dy = endY - startY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 30 && dir.x === 0) nextDir = {x: 1, y: 0};  // Вправо
      else if (dx < -30 && dir.x === 0) nextDir = {x: -1, y: 0}; // Влево
    } else {
      if (dy > 30 && dir.y === 0) nextDir = {x: 0, y: 1};  // Вниз
      else if (dy < -30 && dir.y === 0) nextDir = {x: 0, y: -1}; // Вверх
    }
  }
document.getElementById('btn-start').onclick = startGame;
})();
</script>
</body>
</html>
